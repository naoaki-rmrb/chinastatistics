name: 月次データ更新 (Monthly update)

# 中国の主要月次指標(小売・不動産・貿易)は概ね毎月15〜18日頃に公表され、
# 四半期GDPは1・4・7・10月の中旬。余裕を見て毎月20日に実行する。
on:
  schedule:
    - cron: "0 1 20 * *"      # 毎月20日 01:00 UTC
  workflow_dispatch:          # 手動起動も可能
    inputs:
      only:
        description: "指標を限定 (例: retail,gdp)。空なら全指標"
        required: false
        default: ""

permissions:
  contents: write             # 生成した Excel をコミットするため

concurrency:
  group: china-stats-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存関係のインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: データ取得と Excel 更新
        env:
          PYTHONPATH: src
          ONLY: ${{ github.event.inputs.only }}
        run: |
          python -m chinastats.cli build --only "${ONLY}"

      - name: 成果物をアーティファクトとして退避
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china_indicators_xlsx
          path: output/china_indicators.xlsx
          if-no-files-found: warn

      - name: 変更をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/china_indicators.xlsx output/china_indicators_data.csv
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "chore: 月次データ更新 $(date -u +%Y-%m-%d)"
            git push
          fi
