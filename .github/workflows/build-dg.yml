name: 月次データ更新(新API) (Monthly update via DG API)

on:
  schedule:
    - cron: "0 1 20 * *"      # 毎月20日 01:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: china-stats-dg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: データ取得とExcel生成（新版DG API・VPN不要）
        env:
          PYTHONPATH: src
        run: python -m chinastats.cli build-dg
      - name: 成果物をアーティファクトに退避
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china_indicators_xlsx
          path: |
            output/china_indicators.xlsx
            output/china_indicators_data.csv
          if-no-files-found: warn
      - name: 変更をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/china_indicators.xlsx output/china_indicators_data.csv
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: 月次データ更新(新API) $(date -u +%Y-%m-%d)"
            git push
          fi
