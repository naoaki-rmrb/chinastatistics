name: レポート構造プローブ (Probe report structure)

on:
  workflow_dispatch:
    inputs:
      report_id:
        description: "REPORTID"
        required: false
        default: "96d37aa633164cf0a177432d150c4711"
      dt:
        description: "DT (例 202608MM)"
        required: false
        default: "202608MM"

permissions:
  contents: write

concurrency:
  group: china-stats-dg-all
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/china-economic-indicators-7exy6v
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: プローブ
        env:
          REPORT_ID: ${{ github.event.inputs.report_id }}
          DT: ${{ github.event.inputs.dt }}
        run: python scripts/probe_report.py
      - name: コミット
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/probe_report.json || true
          git commit -m "chore: レポート構造プローブ" || echo "no changes"
          git push origin HEAD:claude/china-economic-indicators-7exy6v || true
