# national = 全国（省ディメンションを持たない全国データベースを使う）
# provinces = 31省・自治区・直轄市（4直轄市: 北京・上海・天津・重慶 を含む）
national:
  code: "000000"     # 便宜上のコード。全国DB(hgyd/hgjd)では reg 指定なしで取得する
  name_zh: "全国"
  name_ja: "全国"

